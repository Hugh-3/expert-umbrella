[package]
name = "content-creator"
version = "1.0.0"
description = "Content Creation Platform Desktop Client"
edition = "2021"

[dependencies]
tauri = { version = "2.1", features = ["dialog-all", "fs-all", "shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = "2.0"

[[bin]]
name = "content-creator"
path = "src/main.rs"
